[project]
name = "marieta"
version = "0.1.0"
description = "Nutritional Meal Planning System"
requires-python = ">=3.12,<3.14"
license = "MIT"

dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.33.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "asyncpg>=0.31.0,<0.32.0",
    "alembic>=1.14.0,<1.15.0",
    "pydantic>=2.10.0,<2.11.0",
    "pydantic-settings>=2.6.0,<2.7.0",
    "redis[hiredis]>=5.2.0,<5.3.0",
    "bcrypt>=5.0.0,<5.1.0",
    "structlog>=24.4.0,<24.5.0",
    "httpx>=0.28.0,<0.29.0",
    "python-multipart>=0.0.12,<0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<8.4.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
    "pytest-cov>=6.0.0,<6.1.0",
    "httpx>=0.28.0,<0.29.0",
    "ruff>=0.8.0,<0.9.0",
    "mypy>=1.13.0,<1.14.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
